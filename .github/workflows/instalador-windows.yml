name: Gerar instalador Windows

on:
  push:
    branches: [main]
    paths:
      - app.py
      - ui_v16.py
      - test_flow_v16.py
      - test_ui_v16.py
      - PDVWordMecanica.iss
      - .github/workflows/instalador-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Testar e compilar Setup.exe v1.6
    runs-on: windows-2022
    steps:
      - name: Baixar repositorio exclusivo da oficina
        uses: actions/checkout@v4

      - name: Configurar Python no Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Instalar bibliotecas e validar codigo
        shell: pwsh
        run: |
          python -m py_compile app.py base_app.py office_flow.py ui_v14.py ui_v15.py ui_v16.py
          python -m py_compile test_flow.py test_integrated.py test_ui_v16.py test_flow_v16.py
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 reportlab==4.4.9

      - name: Testar cadastro, orcamento, caixa e checklist
        shell: pwsh
        run: |
          python test_flow.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste inicial falhou' }
          python test_integrated.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste integrado falhou' }
          python test_ui_v16.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste visual falhou' }
          python test_flow_v16.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste de persistencia falhou' }

      - name: Compilar aplicativo Windows sem Python no computador do cliente
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDVWordMecanica app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller falhou' }
          if (-not (Test-Path 'dist/PDVWordMecanica/PDVWordMecanica.exe')) { throw 'Executavel nao encontrado' }

      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup' }
          }

      - name: Gerar instalador 1.6.0
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe nao encontrado' }
          & $iscc PDVWordMecanica.iss
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do Setup falhou' }
          if (-not (Test-Path 'instalador/PDVWord_Mecanica_Setup_1.6.0.exe')) { throw 'Setup nao foi gerado' }

      - name: Disponibilizar artefato no Actions
        uses: actions/upload-artifact@v4
        with:
          name: PDVWord-Mecanica-Setup-1.6.0
          path: instalador/PDVWord_Mecanica_Setup_1.6.0.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publicar instalador em Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'instalador/PDVWord_Mecanica_Setup_1.6.0.exe'
          $tag = 'v1.6.0-avaliacao'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title 'PDV Word Mecânica 1.6.0 - Atendimento conectado' --notes 'Aprimora seleção e edição do cliente e veículo, orçamento integrado, caixa visual e checklist com foto vinculado ao veículo mesmo sem OS. Versão de avaliação, sem emissão fiscal, sem TEF. Faça backup antes de instalar.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel publicar o instalador' }
