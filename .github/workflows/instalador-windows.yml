name: Gerar instalador Windows

on:
  push:
    branches: [main]
    paths:
      - app.py
      - PDVWordMecanica.iss
      - 'release_18/**'
      - .github/workflows/instalador-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Verificar, testar e gerar Setup Windows 1.8
    runs-on: windows-2022
    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Restaurar fonte 1.8 e conferir SHA256
        shell: pwsh
        run: |
          python release_18/extract_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Fonte 1.8 nao passou na verificacao. Publicacao cancelada.' }

      - name: Instalar dependencias e validar sintaxe
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 reportlab==4.4.9 pypdf==5.9.0 pillow
          if ($LASTEXITCODE -ne 0) { throw 'Dependencias nao instaladas.' }
          python -m py_compile app.py base_app.py office_flow.py ui_v14.py ui_v15.py ui_v16.py workflow_v17.py workflow_v18.py test_flow.py test_v18.py
          if ($LASTEXITCODE -ne 0) { throw 'Erro de sintaxe.' }

      - name: Testar cadastro, orcamento, OS, estoque, venda integrada e PDFs
        shell: pwsh
        run: |
          python test_flow.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste de fluxo basico falhou.' }
          python test_v18.py
          if ($LASTEXITCODE -ne 0) { throw 'Teste integrado 1.8 falhou. Nao publicar.' }

      - name: Expor fonte legivel e testada no repositorio
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workflow_v18.py test_v18.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Publica fontes legiveis da versao 1.8 [skip ci]'
            git push origin HEAD:main
          }

      - name: Compilar aplicativo offline com PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --noupx --windowed --onedir --name PDVWordMecanica app.py
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do aplicativo falhou.' }
          if (-not (Test-Path 'dist/PDVWordMecanica/PDVWordMecanica.exe')) { throw 'EXE nao foi gerado.' }

      - name: Localizar Inno Setup
        shell: pwsh
        run: |
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup indisponivel.' }
          }

      - name: Gerar instalador 1.8.0
        shell: pwsh
        run: |
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe nao encontrado.' }
          & $iscc PDVWordMecanica.iss
          if ($LASTEXITCODE -ne 0) { throw 'Geracao do Setup falhou.' }
          if (-not (Test-Path 'instalador/PDVWord_Mecanica_Setup_1.8.0.exe')) { throw 'Setup 1.8.0 nao foi gerado.' }

      - name: Verificar instalador e EXE com Microsoft Defender
        shell: pwsh
        run: |
          $st = Get-MpComputerStatus -ErrorAction Stop
          if (-not $st.AntivirusEnabled -or -not $st.AMServiceEnabled) { throw 'Defender indisponivel; sem publicacao.' }
          Write-Host "Assinaturas Defender: $($st.AntivirusSignatureVersion)"
          Write-Host "Protecao em tempo real no runner: $($st.RealTimeProtectionEnabled)"
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Warning "Atualizacao das assinaturas nao concluida: $_" }
          $targets = @('dist/PDVWordMecanica/PDVWordMecanica.exe','instalador/PDVWord_Mecanica_Setup_1.8.0.exe')
          foreach ($file in $targets) {
            $full = (Resolve-Path $file -ErrorAction Stop).Path
            Start-MpScan -ScanType CustomScan -ScanPath $full -ErrorAction Stop
            $matches = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              ($_.Resources -join ';') -like "*$([System.IO.Path]::GetFileName($file))*"
            })
            if ($matches.Count -gt 0 -or -not (Test-Path $full)) { throw "Arquivo bloqueado pelo Defender: $file. Publicacao suspensa." }
            Write-Host "Varredura pontual sem deteccao no runner: $file"
          }
          $hash = (Get-FileHash 'instalador/PDVWord_Mecanica_Setup_1.8.0.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *PDVWord_Mecanica_Setup_1.8.0.exe" | Set-Content 'instalador/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256 do setup: $hash"

      - name: Guardar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PDVWord-Mecanica-Setup-1.8.0
          path: |
            instalador/PDVWord_Mecanica_Setup_1.8.0.exe
            instalador/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publicar na pagina de Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'instalador/PDVWord_Mecanica_Setup_1.8.0.exe'
          $tag = 'v1.8.0-avaliacao'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset 'instalador/SHA256SUMS.txt' --clobber
          } else {
            gh release create $tag $asset 'instalador/SHA256SUMS.txt' --title 'PDV Word Mecânica 1.8.0 - Caixa simplificado' --notes 'Versao de avaliacao 1.8: vendas por cliente com OS concluida e produtos extras sem duplicar itens do orcamento, lancamentos de entradas/despesas, ficha tecnica A4 com logo da oficina e recibo A5 neutro. O Defender teve varredura pontual em runner, nao certificacao. Nao contorna bloqueio de antivírus e nao inclui emissao fiscal nem TEF. Faça backup antes de testar.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
