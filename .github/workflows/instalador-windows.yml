name: Gerar instalador Windows

on:
  push:
    branches: [main]
    paths:
      - source.tar.xz.b64
      - .github/workflows/instalador-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar e disponibilizar Setup.exe
    runs-on: windows-2022
    steps:
      - name: Obter projeto exclusivo
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extrair arquivos originais da versão 1.1
        shell: pwsh
        run: |
          if (-not (Test-Path 'source.tar.xz.b64')) { throw 'Pacote fonte nao encontrado.' }
          $encoded = (Get-Content 'source.tar.xz.b64' -Raw).Trim()
          [System.IO.File]::WriteAllBytes((Join-Path $pwd 'source.tar.xz'), [System.Convert]::FromBase64String($encoded))
          tar -xf source.tar.xz
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao extrair pacote fonte.' }
          foreach ($file in @('app.py','base_app.py','PDVWordMecanica.iss')) {
            if (-not (Test-Path $file)) { throw "Arquivo obrigatorio nao encontrado: $file" }
          }
      - name: Validar codigo e ambiente
        shell: pwsh
        run: |
          python -m py_compile app.py base_app.py
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0
      - name: Criar executavel do aplicativo
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name PDVWordMecanica app.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar o aplicativo.' }
          if (-not (Test-Path 'dist/PDVWordMecanica/PDVWordMecanica.exe')) { throw 'Executavel nao foi gerado.' }
      - name: Instalar Inno Setup se necessario
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup.' }
          }
      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe nao encontrado.' }
          & $iscc PDVWordMecanica.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar instalador.' }
          if (-not (Test-Path 'instalador/PDVWord_Mecanica_Setup_1.1.0.exe')) { throw 'Setup.exe nao foi gerado.' }
      - name: Publicar fonte legivel no repositorio
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py base_app.py PDVWordMecanica.iss INICIAR_WINDOWS.bat GERAR_INSTALADOR_WINDOWS.bat
          $status = git status --porcelain
          if ($status) {
            git commit -m "Publica codigo-fonte da versao de avaliacao 1.1"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Nao foi possivel publicar os arquivos de fonte legiveis.' }
          }
      - name: Anexar instalador ao Actions
        uses: actions/upload-artifact@v4
        with:
          name: PDVWord-Mecanica-Setup-1.1.0
          path: instalador/PDVWord_Mecanica_Setup_1.1.0.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publicar release de avaliacao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'instalador/PDVWord_Mecanica_Setup_1.1.0.exe'
          $tag = 'v1.1.0-avaliacao'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title 'PDV Word Mecanica 1.1.0 - avaliacao' --notes 'Instalador Windows de avaliacao. NAO HOMOLOGADO PARA USO COMERCIAL: sem emissao fiscal, TEF, permissoes ou auditoria. Testar antes de usar com clientes.' --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
