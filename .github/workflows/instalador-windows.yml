name: Gerar instalador Windows

on:
  push:
    branches: [atualizacao-1.10.0]
    paths:
      - app.py
      - core_v110.py
      - ux_v110.py
      - test_v110.py
      - ux_v19.py
      - ux_v192.py
      - ux_v193.py
      - ux_v194.py
      - ux_v195.py
      - ux_v196.py
      - ux_v198.py
      - ux_v199.py
      - ux_v1910.py
      - test_v1910.py
      - test_v1911.py
      - test_v199.py
      - test_v198.py
      - os_documents_v196.py
      - business_v195.py
      - test_v193.py
      - test_v194.py
      - test_v195.py
      - test_v196.py
      - ui_v15.py
      - ui_v14.py
      - office_flow.py
      - test_v19.py
      - PDVWordMecanica.iss
      - README.md
      - workflow_v18.py
      - test_v18.py
      - 'release_18/**'
      - .github/workflows/instalador-windows.yml
  workflow_dispatch:

concurrency:
  group: pdv-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compilar:
    name: Verificar, testar e gerar Setup Windows 1.10.0
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Instalar dependencias e validar sintaxe
        shell: pwsh
        run: |
          python -m pip install "Nuitka==4.3.5" ordered-set zstandard reportlab==4.4.9 pypdf==5.9.0 pillow
          if ($LASTEXITCODE -ne 0) { throw 'Dependencias nao instaladas.' }
          python -m py_compile app.py base_app.py office_flow.py ui_v14.py ui_v15.py ui_v16.py workflow_v17.py workflow_v18.py test_flow.py test_v18.py ux_v19.py ux_v192.py ux_v193.py ux_v194.py ux_v195.py ux_v196.py ux_v198.py ux_v199.py ux_v1910.py os_documents_v196.py business_v195.py test_v19.py test_v193.py test_v194.py test_v195.py test_v196.py test_v198.py test_v199.py test_v1910.py test_v1911.py core_v110.py ux_v110.py test_v110.py
          if ($LASTEXITCODE -ne 0) { throw 'Erro de sintaxe.' }

      - name: Testar test_flow.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_flow.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_flow.py. Nao publicar.' }

      - name: Testar test_v18.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v18.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v18.py. Nao publicar.' }

      - name: Testar test_v19.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v19.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v19.py. Nao publicar.' }

      - name: Testar test_v193.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v193.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v193.py. Nao publicar.' }

      - name: Testar test_v194.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v194.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v194.py. Nao publicar.' }

      - name: Testar test_v195.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v195.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v195.py. Nao publicar.' }

      - name: Testar test_v196.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v196.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v196.py. Nao publicar.' }

      - name: Testar test_v198.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v198.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v198.py. Nao publicar.' }

      - name: Testar test_v199.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v199.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v199.py. Nao publicar.' }

      - name: Testar test_v1910.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v1910.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v1910.py. Nao publicar.' }

      - name: Testar test_v1911.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v1911.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v1911.py. Nao publicar.' }

      - name: Testar test_v110.py
        timeout-minutes: 3
        shell: pwsh
        run: |
          python -u -X faulthandler test_v110.py
          if ($LASTEXITCODE -ne 0) { throw 'Falhou test_v110.py. Nao publicar.' }

      - name: Compilar aplicativo com Nuitka (binario nativo, sem bootloader PyInstaller)
        shell: pwsh
        run: |
          python -m nuitka --mode=standalone --enable-plugin=tk-inter --windows-console-mode=disable --assume-yes-for-downloads --output-dir=build --output-filename=PDVWordMecanica.exe --jobs=3 --lto=no app.py
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao nativa Nuitka falhou.' }
          if (-not (Test-Path 'build/app.dist/PDVWordMecanica.exe')) { throw 'EXE nativo nao foi gerado.' }
          Rename-Item -Path 'build/app.dist' -NewName 'PDVWordMecanica.dist'
          if (-not (Test-Path 'build/PDVWordMecanica.dist/PDVWordMecanica.exe')) { throw 'Pasta da aplicacao nao encontrada.' }
          $file = (Resolve-Path 'build/PDVWordMecanica.dist/PDVWordMecanica.exe').Path
          $p = Start-Process -FilePath $file -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          if ($p.HasExited) { throw "App nativo terminou ao abrir. Exit code: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Localizar Inno Setup
        shell: pwsh
        run: |
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup indisponivel.' }
          }

      - name: Gerar instalador 1.10.0
        shell: pwsh
        run: |
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe nao encontrado.' }
          & $iscc PDVWordMecanica.iss
          if ($LASTEXITCODE -ne 0) { throw 'Geracao do Setup falhou.' }
          if (-not (Test-Path 'instalador/PDVWord_Mecanica_Setup_1.10.0.exe')) { throw 'Setup 1.10.0 nao foi gerado.' }

      - name: Verificar instalador e EXE com Microsoft Defender
        shell: pwsh
        run: |
          $st = Get-MpComputerStatus -ErrorAction Stop
          if (-not $st.AntivirusEnabled -or -not $st.AMServiceEnabled) { throw 'Defender indisponivel; sem publicacao.' }
          Write-Host "Assinaturas Defender: $($st.AntivirusSignatureVersion)"
          Write-Host "Protecao em tempo real no runner: $($st.RealTimeProtectionEnabled)"
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Warning "Atualizacao das assinaturas nao concluida: $_" }
          $targets = @('build/PDVWordMecanica.dist/PDVWordMecanica.exe','instalador/PDVWord_Mecanica_Setup_1.10.0.exe')
          foreach ($file in $targets) {
            $full = (Resolve-Path $file -ErrorAction Stop).Path
            Start-MpScan -ScanType CustomScan -ScanPath $full -ErrorAction Stop
            $matches = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              ($_.Resources -join ';') -like "*$([System.IO.Path]::GetFileName($file))*"
            })
            if ($matches.Count -gt 0 -or -not (Test-Path $full)) { throw "Arquivo bloqueado pelo Defender: $file. Publicacao suspensa." }
            Write-Host "Varredura pontual sem deteccao no runner: $file"
          }
          $hash = (Get-FileHash 'instalador/PDVWord_Mecanica_Setup_1.10.0.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *PDVWord_Mecanica_Setup_1.10.0.exe" | Set-Content 'instalador/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256 do setup: $hash"

      - name: Guardar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PDVWord-Mecanica-Setup-1.10.0
          path: |
            instalador/PDVWord_Mecanica_Setup_1.10.0.exe
            instalador/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
